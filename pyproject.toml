[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musparql"
version = "0.1.0"
description = "Human-curated NL-SPARQL benchmark workflow for domain knowledge graphs"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "alembic>=1.16,<2",
    "Flask>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
]

[project.scripts]
musparql-db = "musparql.database.cli:main"
musparql-web = "musparql.web.cli:main"

[project.optional-dependencies]
test = [
    "jsonschema[format]>=4.23,<5",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"musparql.database.alembic" = ["README.md", "script.py.mako"]
"musparql.web" = ["templates/*.html", "static/*.css"]
