<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Four-stage Musparql benchmark curation workflow</title>
  <desc id="desc">Knowledge graph sources enter four stages: source and query acquisition, evidence alignment and question formulation, human review, and benchmark publication. The output is a versioned NL-SPARQL benchmark with provenance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .source { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .stage { fill: #ffffff; stroke: #334155; stroke-width: 2.2; }
      .align { fill: #eef6ff; stroke: #2563a6; stroke-width: 2.2; }
      .review { fill: #fff7e8; stroke: #a45b12; stroke-width: 2.4; }
      .publish { fill: #f2f8f2; stroke: #397349; stroke-width: 2.2; }
      .output { fill: #edf7ef; stroke: #2f6b3d; stroke-width: 2.4; }
      .inner { fill: #ffffff; stroke: #93a4b8; stroke-width: 1.3; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #172033; }
      .stage-no { font-family: Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #475569; letter-spacing: .7px; }
      .text { font-family: Arial, sans-serif; font-size: 13px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 11.5px; fill: #475569; }
      .em { font-family: Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1f3f62; }
      .top { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #172033; }
      .arrow { stroke: #475569; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .assist { stroke: #2563a6; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <text x="640" y="36" text-anchor="middle" class="top">Traceable source material becomes benchmark data only through expert review</text>
  <text x="640" y="62" text-anchor="middle" class="small">Human-authored SPARQL • existing natural-language evidence • provisional LLM assistance • visible provenance</text>

  <rect x="18" y="167" width="128" height="162" rx="12" class="source"/>
  <text x="82" y="198" text-anchor="middle" class="title">KG sources</text>
  <text x="82" y="228" text-anchor="middle" class="text">repositories</text>
  <text x="82" y="252" text-anchor="middle" class="text">documentation</text>
  <text x="82" y="276" text-anchor="middle" class="text">papers &amp; guides</text>
  <text x="82" y="303" text-anchor="middle" class="small">human-written</text>
  <text x="82" y="321" text-anchor="middle" class="small">SPARQL + NL</text>

  <text x="271" y="105" text-anchor="middle" class="stage-no">STAGE 1</text>
  <rect x="164" y="122" width="214" height="252" rx="14" class="stage"/>
  <text x="271" y="154" text-anchor="middle" class="title">Source &amp; query</text>
  <text x="271" y="177" text-anchor="middle" class="title">acquisition</text>
  <line x1="184" y1="193" x2="358" y2="193" class="divider"/>
  <text x="271" y="220" text-anchor="middle" class="text">extract implemented or</text>
  <text x="271" y="242" text-anchor="middle" class="text">published SPARQL</text>
  <text x="271" y="275" text-anchor="middle" class="text">capture nearby NL</text>
  <text x="271" y="297" text-anchor="middle" class="text">and execution metadata</text>
  <text x="271" y="338" text-anchor="middle" class="small">query + source provenance</text>

  <text x="511" y="105" text-anchor="middle" class="stage-no">STAGE 2</text>
  <rect x="404" y="122" width="214" height="252" rx="14" class="align"/>
  <text x="511" y="154" text-anchor="middle" class="title">Evidence alignment &amp;</text>
  <text x="511" y="177" text-anchor="middle" class="title">question formulation</text>
  <rect x="421" y="199" width="180" height="52" rx="8" class="inner"/>
  <text x="511" y="220" text-anchor="middle" class="em">NL evidence +</text>
  <text x="511" y="240" text-anchor="middle" class="em">source provenance</text>
  <text x="511" y="279" text-anchor="middle" class="text">align or paraphrase</text>
  <text x="511" y="300" text-anchor="middle" class="text">existing human wording</text>
  <text x="511" y="338" text-anchor="middle" class="small">formulate only if needed</text>

  <rect x="435" y="407" width="152" height="48" rx="9" class="inner"/>
  <text x="511" y="427" text-anchor="middle" class="em">LLM assistance</text>
  <text x="511" y="446" text-anchor="middle" class="small">provisional candidates</text>
  <path d="M 511 407 L 511 376" class="assist"/>

  <text x="751" y="105" text-anchor="middle" class="stage-no">STAGE 3</text>
  <rect x="644" y="122" width="214" height="252" rx="14" class="review"/>
  <text x="751" y="154" text-anchor="middle" class="title">Human review</text>
  <line x1="664" y1="177" x2="838" y2="177" class="divider"/>
  <text x="751" y="208" text-anchor="middle" class="text">semantic faithfulness</text>
  <text x="751" y="238" text-anchor="middle" class="text">meaningful user intent</text>
  <text x="751" y="268" text-anchor="middle" class="text">domain terminology &amp;</text>
  <text x="751" y="289" text-anchor="middle" class="text">communicative salience</text>
  <text x="751" y="329" text-anchor="middle" class="small">accept • rewrite • exclude</text>
  <text x="751" y="350" text-anchor="middle" class="small">expert effort is explicit</text>

  <text x="991" y="105" text-anchor="middle" class="stage-no">STAGE 4</text>
  <rect x="884" y="122" width="214" height="252" rx="14" class="publish"/>
  <text x="991" y="154" text-anchor="middle" class="title">Benchmark</text>
  <text x="991" y="177" text-anchor="middle" class="title">publication</text>
  <line x1="904" y1="193" x2="1078" y2="193" class="divider"/>
  <text x="991" y="222" text-anchor="middle" class="text">one canonical question</text>
  <text x="991" y="244" text-anchor="middle" class="text">per scoring query</text>
  <text x="991" y="282" text-anchor="middle" class="text">public provenance &amp;</text>
  <text x="991" y="304" text-anchor="middle" class="text">accepted alternatives</text>
  <text x="991" y="342" text-anchor="middle" class="small">versioned, reproducible</text>

  <rect x="1116" y="167" width="146" height="162" rx="12" class="output"/>
  <text x="1189" y="198" text-anchor="middle" class="title">NL-SPARQL</text>
  <text x="1189" y="221" text-anchor="middle" class="title">benchmark</text>
  <text x="1189" y="255" text-anchor="middle" class="text">100 public pairs</text>
  <text x="1189" y="281" text-anchor="middle" class="text">+ provenance</text>
  <text x="1189" y="299" text-anchor="middle" class="small">private holdout</text>
  <text x="1189" y="317" text-anchor="middle" class="small">stored separately</text>

  <path d="M 146 248 L 163 248" class="arrow"/>
  <path d="M 378 248 L 403 248" class="arrow"/>
  <path d="M 618 248 L 643 248" class="arrow"/>
  <path d="M 858 248 L 883 248" class="arrow"/>
  <path d="M 1098 248 L 1115 248" class="arrow"/>
</svg>
