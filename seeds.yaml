kgs:
  - kg_id: organs
    name: Polifonia Organs Knowledge Graph
    project: Polifonia
    description_hint: >
      Knowledge graph describing historical pipe organs, their builders,
      locations, construction events, and related heritage information.
    sparql:
      endpoint: https://polifonia.disi.unibo.it/organs/sparql
      auth: none
      graph: http://w3id.org/polifonia/resource/organs/
      fallbacks:
        - endpoint: https://data.open.ac.uk/sparql
          auth: none
    source_ids:
      - organs-knowledge-graph-repository
      - organs-ontology-readme
      - organs-ontology-curated-extract
    priority: high
    notes: >
      Already partially curated manually. Use as baseline for automation tests.

  - kg_id: meetups
    name: Polifonia MEETUPS Knowledge Graph
    project: Polifonia
    description_hint: >
      Knowledge graph describing musical events, meetings, performances,
      participants, places, and times.
    sparql:
      endpoint: https://polifonia.disi.unibo.it/meetups/sparql
      auth: none
      fallbacks:
        - endpoint: https://data.open.ac.uk/sparql
          auth: none
    source_ids:
      - meetups-knowledge-graph-repository
      - meetups-query-examples
      - meetups-semmes-2023-paper
      - meetups-eswc-2024-paper
    priority: high
    notes: >
      Provides a page of example SPARQL queries – ideal for bootstrapping pairs.

  - kg_id: musow
    name: MUSOW Knowledge Graph
    project: Polifonia
    description_hint: >
      Conceptual and registry-style knowledge graph modelling musicological
      concepts, vocabularies, and scholarly classifications using SKOS and
      related ontologies.
    sparql:
      endpoint: https://data.open.ac.uk/sparql
      auth: none
      expected_namespaces:
        - http://w3id.org/polifonia/ontology/musow#
        - http://www.w3.org/2004/02/skos/core#
    source_ids:
      - musow-registry-data-repository
      - musow-licence-experiments-repository
      - musow-project-page
    priority: medium
    notes: >
      MUSOW is a conceptual and registry-style knowledge graph developed in the
      Polifonia project, modelling musicological concepts, vocabularies, and
      scholarly classifications using SKOS and related ontologies. While it is
      not an event-based KG, it is accompanied by curated SPARQL query examples
      and query guides, making it suitable for collecting runnable SELECT
      queries and generating natural-language question–SPARQL pairs.

  - kg_id: musicbo
    name: Polifonia MusicBO Knowledge Graph
    project: Polifonia
    description_hint: >
      Knowledge graph derived from Bologna’s musical heritage, focusing on
      composers, works, performances, and archival sources.
    sparql:
      endpoint: https://polifonia.disi.unibo.it/musicbo/sparql
      auth: none
    source_ids:
      - musicbo-knowledge-graph-repository
    priority: medium
    notes: >
      Repo contains SPARQL examples embedded in documentation rather than .rq files.

  - kg_id: jazzontology
    name: Jazz Ontology (Dig That Lick)
    project: Dig That Lick
    description_hint: >
      Ontology and RDF datasets for jazz metadata, performances, sessions,
      recordings, and related discographic information.
    dataset:
      dump_url: https://osf.io/qnb4k/download
      local_path: dumps/jazzontology.ttl
      format: turtle
    source_ids:
      - jazz-ontology-repository
      - jazz-ontology-supplement
      - jazz-ontology-2022-paper
    priority: medium
    notes: >
      RDF data dump (TTL) referenced at https://osf.io/bwg42/files/qnb4k.

  - kg_id: linkedmusic
    name: LinkedMusic Data Lake
    project: LinkedMusic
    description_hint: >
      Integrated music knowledge graph that reconciles metadata through Wikidata
      and exposes named RDF graphs for DIAMM, Dig That Lick, the Weimar Jazz
      Database, The Global Jukebox, the University of Tennessee Song Index,
      MusicBrainz, The Session, RISM, Cantus Database, Cantus Index, SIMSSA DB,
      and the NFDI4Culture APSearch, Detmolder Hoftheater, and
      musiconn.performance knowledge graphs.
    sparql:
      endpoint: https://virtuoso.simssa.ca/sparql/
      auth: none
      expected_namespaces:
        - https://linkedmusic.ca/graphs/
        - http://www.wikidata.org/prop/direct/
    source_ids:
      - linkedmusic-datalake-repository
      - linkedmusic-queries-repository
      - linkedmusic-project-website
      - linkedmusic-sample-queries
      - linkedmusic-prefix-catalogue
      - linkedmusic-public-query-database
      - sesemmi-linkedmusic-2025-paper
      - linkedmusic-integrating-databases-2025-article
      - linkedmusic-sustainable-archiving-2025-paper
      - linkedmusic-corrected-examples-working-copy
    priority: high
    notes: >
      Official sources provide twenty public NLQ-SPARQL benchmark pairs across
      four challenge levels, plus repository and wiki documentation for the
      constituent named graphs and cross-graph querying.
