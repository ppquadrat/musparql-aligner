schema: musparql.kg-seeds.v2
kgs:
  - kg_id: organs
    seed_version: "2026-08-18.1"
    name: Polifonia Organs Knowledge Graph
    project: Polifonia
    description_hint: >
      Knowledge graph describing historical pipe organs, their builders,
      locations, construction events, and related heritage information.
    sparql:
      endpoint: https://polifonia.disi.unibo.it/organs/sparql
      auth: none
      graph: http://w3id.org/polifonia/resource/organs/
      fallbacks:
        - endpoint: https://data.open.ac.uk/sparql
          auth: none
    source_ids:
      - organs-knowledge-graph-repository
      - organs-ontology-readme
      - organs-ontology-curated-extract
    priority: high
    notes: >
      Already partially curated manually. Use as baseline for automation tests.
    review_domains:
      - domain_id: pipe-organs-organology
        label: Pipe organs and organology
        description: >
          Pipe organs, their builders, components and specifications,
          construction and modification events, locations and institutions,
          and associated historical and heritage records.
    familiarity_scopes:
      - scope_id: organs
        label: Polifonia Organs Knowledge Graph
        kind: knowledge_graph

  - kg_id: meetups
    seed_version: "2026-08-18.1"
    name: Polifonia MEETUPS Knowledge Graph
    project: Polifonia
    description_hint: >
      Knowledge graph describing musical events, meetings, performances,
      participants, places, and times.
    sparql:
      endpoint: https://polifonia.disi.unibo.it/meetups/sparql
      auth: none
      fallbacks:
        - endpoint: https://data.open.ac.uk/sparql
          auth: none
    source_ids:
      - meetups-knowledge-graph-repository
      - meetups-query-examples
      - meetups-semmes-2023-paper
      - meetups-eswc-2024-paper
    priority: high
    notes: >
      Provides a page of example SPARQL queries – ideal for bootstrapping pairs.
    review_domains:
      - domain_id: historical-musical-encounters-events
        label: Historical musical encounters and events
        description: >
          Documented encounters and collaborations in music history; the people
          and roles involved; their places, dates and purposes; and the
          biographical evidence used to describe them. The nominal European
          c. 1800–1945 period describes source provenance rather than the
          expertise boundary or balanced geographic coverage.
    familiarity_scopes:
      - scope_id: meetups
        label: Polifonia MEETUPS Knowledge Graph
        kind: knowledge_graph

  - kg_id: musow
    seed_version: "2026-08-18.1"
    name: MUSOW Knowledge Graph
    project: Polifonia
    description_hint: >
      Conceptual and registry-style knowledge graph modelling musicological
      concepts, vocabularies, and scholarly classifications using SKOS and
      related ontologies.
    sparql:
      endpoint: https://data.open.ac.uk/sparql
      auth: none
      expected_namespaces:
        - http://w3id.org/polifonia/ontology/musow#
        - http://www.w3.org/2004/02/skos/core#
    source_ids:
      - musow-registry-data-repository
      - musow-licence-experiments-repository
      - musow-project-page
    priority: medium
    notes: >
      MUSOW is a conceptual and registry-style knowledge graph developed in the
      Polifonia project, modelling musicological concepts, vocabularies, and
      scholarly classifications using SKOS and related ontologies. While it is
      not an event-based KG, it is accompanied by curated SPARQL query examples
      and query guides, making it suitable for collecting runnable SELECT
      queries and generating natural-language question–SPARQL pairs.
    review_domains:
      - domain_id: digital-music-research-resources
        label: Digital music research resources available online
        description: >
          Online catalogues, digital libraries and repositories, datasets,
          linked open data, digital editions, services and software, schemas,
          ontologies, formats and symbolic-music resources included in the
          musoW survey.
    familiarity_scopes:
      - scope_id: musow
        label: MUSOW Knowledge Graph
        kind: knowledge_graph

  - kg_id: musicbo
    seed_version: "2026-08-18.1"
    name: Polifonia MusicBO Knowledge Graph
    project: Polifonia
    description_hint: >
      Knowledge graph derived from Bologna’s musical heritage, focusing on
      composers, works, performances, and archival sources.
    sparql:
      endpoint: https://polifonia.disi.unibo.it/musicbo/sparql
      auth: none
    source_ids:
      - musicbo-knowledge-graph-repository
    priority: medium
    notes: >
      Repo contains SPARQL examples embedded in documentation rather than .rq files.
    review_domains:
      - domain_id: bologna-musical-heritage
        label: Bologna's musical heritage
        description: >
          Composers, musical works, performances, archival sources,
          institutions and places associated with Bologna's musical history.
    familiarity_scopes:
      - scope_id: musicbo
        label: Polifonia MusicBO Knowledge Graph
        kind: knowledge_graph

  - kg_id: jazzontology
    seed_version: "2026-08-18.1"
    name: Jazz Ontology (Dig That Lick)
    project: Dig That Lick
    description_hint: >
      Ontology and RDF datasets for jazz metadata, performances, sessions,
      recordings, and related discographic information.
    dataset:
      dump_url: https://osf.io/qnb4k/download
      local_path: var/cache/dumps/jazzontology.ttl
      format: turtle
    source_ids:
      - jazz-ontology-repository
      - jazz-ontology-supplement
      - jazz-ontology-2022-paper
    priority: medium
    notes: >
      RDF data dump (TTL) referenced at https://osf.io/bwg42/files/qnb4k.
    review_domains:
      - domain_id: jazz-discography-performance
        label: Jazz discography and performance
        description: >
          Jazz musicians, instruments, performances, recording sessions,
          recordings, solos, tracks, releases and the discographic evidence
          used to document them.
    familiarity_scopes:
      - scope_id: jazzontology
        label: Jazz Ontology (Dig That Lick)
        kind: knowledge_graph

  - kg_id: linkedmusic
    seed_version: "2026-08-23.1"
    name: LinkedMusic Data Lake
    project: LinkedMusic
    description_hint: >
      Integrated music knowledge graph that reconciles metadata through Wikidata
      and exposes named RDF graphs for DIAMM, Dig That Lick, the Weimar Jazz
      Database, The Global Jukebox, the University of Tennessee Song Index,
      MusicBrainz, The Session, RISM, Cantus Database, Cantus Index, SIMSSA DB,
      and the NFDI4Culture APSearch, Detmolder Hoftheater, and
      musiconn.performance knowledge graphs.
    sparql:
      endpoint: https://virtuoso.simssa.ca/sparql/
      auth: none
      expected_namespaces:
        - https://linkedmusic.ca/graphs/
        - http://www.wikidata.org/prop/direct/
    source_ids:
      - linkedmusic-datalake-repository
      - linkedmusic-queries-repository
      - linkedmusic-project-website
      - linkedmusic-sample-queries
      - linkedmusic-prefix-catalogue
      - linkedmusic-public-query-database
      - sesemmi-linkedmusic-2025-paper
      - sesemmi-linkedmusic-2026-acm-paper
      - sesemmi-linkedmusic-2026-acm-paper-query
      - sesemmi-linkedmusic-repository
      - linkedmusic-integrating-databases-2025-article
      - linkedmusic-sustainable-archiving-2025-paper
      - linkedmusic-corrected-examples-working-copy
    priority: high
    notes: >
      Official sources provide twenty public NLQ-SPARQL benchmark pairs across
      four challenge levels, plus repository and wiki documentation for the
      constituent named graphs and cross-graph querying. The DLfM 2026 paper
      contributes one additional authored cross-database example.
    review_domains:
      - domain_id: medieval-european-music-manuscripts
        label: Medieval European music manuscripts
        description: >
          Medieval European music manuscripts, their sources, contents,
          provenance, institutions, people and scholarly catalogue metadata.
      - domain_id: jazz-discography-performance
        label: Jazz discography and performance
        description: >
          Jazz musicians, instruments, performances, recording sessions,
          recordings, solos, tracks, releases and the discographic evidence
          used to document them.
      - domain_id: global-song-comparative-analysis
        label: >
          Traditional, Indigenous, folk and popular song worldwide;
          cross-cultural comparative music analysis
        description: >
          Traditional, Indigenous, folk and popular song traditions worldwide,
          including their musical, geographic and cultural attributes and their
          use in cross-cultural comparative music analysis.
      - domain_id: recorded-music-discography
        label: Recorded music discography
        description: >
          Recorded music releases, recordings, tracks, artists, labels and the
          identifiers and relationships used in discographic metadata.
      - domain_id: irish-traditional-music
        label: Irish traditional music
        description: >
          Irish traditional tunes, tune types, settings, sessions, recordings,
          musicians and related community-contributed metadata.
    familiarity_scopes:
      - scope_id: diamm
        label: Digital Image Archive of Medieval Music (DIAMM)
        kind: resource
      - scope_id: dig-that-lick
        label: Dig That Lick
        kind: resource
      - scope_id: global-jukebox
        label: The Global Jukebox
        kind: resource
      - scope_id: musicbrainz
        label: MusicBrainz
        kind: resource
      - scope_id: the-session
        label: The Session
        kind: resource
      - scope_id: linkedmusic
        label: LinkedMusic Data Lake
        kind: federation

  - kg_id: alyra
    seed_version: "2026-08-23.1"
    name: Archaic Lyric Poetry Ontology (ALyrA)
    project: TALOS AI for SSH
    description_hint: >
      Version 1.0 of the Archaic Lyrical Agora ontoterminology, modelling
      Archaic Greek lyric poets, poetic genres and subgenres, literary works,
      places, dates, terminology, and defining characteristics in English and
      Greek.
    dataset:
      dump_url: https://zenodo.org/records/13371967/files/ALyrA_v.1.0.rdf.rdf?download=1
      local_path: var/cache/dumps/alyra-v1.0.rdf
      format: xml
    source_ids:
      - alyra-talos-dataset-page
      - alyra-zenodo-v1
      - alyra-v1-rdf-export
      - alyra-mdtt-2025-paper
      - alyra-mdtt-2025-paper-query
    priority: medium
    notes: >
      No dedicated ALyrA SPARQL service or public source repository was found.
      Execute the five validated Zenodo examples and the related MDTT 2025
      paper query against the complete local v1.0 RDF/XML export. The
      sparql.org link in the project documentation is a generic client, not an
      ALyrA endpoint. The dataset is licensed CC BY-NC-ND 4.0.
    review_domains:
      - domain_id: archaic-greek-lyric-poetry
        label: Archaic Greek lyric poetry
        description: >
          Archaic Greek lyric poets and poetesses, poetic genres and subgenres,
          literary works and fragments, metre, dialect, performance, occasion,
          content, chronology, and associated ancient places and identifiers.
    familiarity_scopes:
      - scope_id: alyra
        label: Archaic Lyric Poetry Ontology (ALyrA)
        kind: knowledge_graph

  - kg_id: camera-dei-deputati
    seed_version: "2026-08-23.2"
    name: Camera dei Deputati Knowledge Graph
    project: Camera dei deputati open data
    description_hint: >
      Official knowledge graph describing the activities and historical record
      of the Italian Chamber of Deputies, including deputies, mandates,
      parliamentary groups and offices, legislation, votes, sessions, debates,
      governments, and related parliamentary resources.
    sparql:
      endpoint: https://dati.camera.it/sparql
      auth: none
      expected_namespaces:
        - http://dati.camera.it/ocd/
    source_ids:
      - camera-dei-deputati-ocd-documentation
      - camera-dei-deputati-endpoint-examples
      - camera-dei-deputati-endpoint-examples-curated
      - camera-dei-deputati-sparna-article
      - camera-dei-deputati-sparna-examples-curated
    priority: medium
    notes: >
      The endpoint interface loads its current examples from the official XML
      source. The Italian OCD documentation contains an older, substantially
      overlapping example set, while the Sparna article contributes three
      English-described examples transcribed from its query screenshots.
      Deduplicate overlapping examples and preserve legislature/version context.
    review_domains:
      - domain_id: italian-parliamentary-activity-legislation
        label: Italian parliamentary activity and legislation
        description: >
          The Italian Chamber of Deputies, its members, mandates, parliamentary
          groups, offices and committees; bills and legislative procedure;
          votes, sessions and debates; governments and related parliamentary
          records across historical legislatures.
    familiarity_scopes:
      - scope_id: camera-dei-deputati
        label: Camera dei Deputati Open Data Knowledge Graph (OCD)
        kind: knowledge_graph

  - kg_id: cdec
    seed_version: "2026-08-23.1"
    name: CDEC Knowledge Graph
    project: Fondazione Centro di Documentazione Ebraica Contemporanea
    description_hint: >
      Official linked open data from the CDEC documentary heritage concerning
      Jews in twentieth-century Italy, with the historical Shoah graph
      describing people, persecution, arrests, deportations, convoys, camps,
      places, and related archival evidence.
    sparql:
      endpoint: https://lod.xdams.org/sparql
      auth: none
      graph: http://dati.cdec.it/lod/shoah/
      expected_namespaces:
        - http://dati.cdec.it/lod/shoah/
        - http://dati.cdec.it/lod/bio-ext/
    source_ids:
      - cdec-official-sparql-examples
    priority: medium
    notes: >
      The official examples page contains nine Italian question-and-query pairs
      and explicitly selects the historical Shoah named graph. The graph IRI is
      active at the endpoint, although dereferencing it as a webpage currently
      reaches a broken ontology-documentation redirect. Preserve the graph's
      historical scope and validate currency before broader CDEC attribution.
    review_domains:
      - domain_id: jews-in-italy-shoah-documentation
        label: Jews in Italy and Shoah documentation
        description: >
          Jews in twentieth-century Italy and the documentary record of
          persecution and the Shoah, including people, arrests, deportations,
          convoys, camps, places, dates, outcomes, and related CDEC archival
          evidence.
    familiarity_scopes:
      - scope_id: cdec-shoah
        label: CDEC Linked Open Data Shoah graph
        kind: knowledge_graph

  - kg_id: nfdi4culture
    seed_version: "2026-08-23.1"
    name: NFDI4Culture Culture Knowledge Graph
    project: NFDI4Culture
    description_hint: >
      Cross-domain research information and research data knowledge graph for
      cultural heritage and the humanities, interconnecting resources from
      architecture, art history, musicology, performing arts, archives, and
      audiovisual collections using NFDIcore and the NFDI4Culture Ontology.
    sparql:
      endpoint: https://nfdi4culture.de/sparql
      auth: none
      expected_namespaces:
        - https://nfdi4culture.de/ontology/
        - https://nfdi.fiz-karlsruhe.de/ontology/
        - https://nfdi4culture.de/id/
    source_ids:
      - nfdi4culture-ckg-query-page
      - nfdi4culture-ckg-deep-dive
      - nfdi4culture-ckg-approved-examples
    priority: medium
    notes: >
      The canonical curated source contains six approved authored examples:
      three linked from the public query page and three linked from the official
      deep-dive presentation. Four generic graph-inspection queries are excluded,
      as are duplicate repository examples and ontology maintenance, validation,
      and quality-control SPARQL. One approved example federates with Wikidata.
    review_domains:
      - domain_id: architecture-space-management
        label: Architecture and space management
        description: >
          Architectural heritage, buildings, sites, spatial organization,
          planning, and the research data, standards, institutions, and services
          used to document and manage them.
      - domain_id: art-art-history
        label: Art and art history
        description: >
          Artworks, artists, collections, visual culture, provenance, art-
          historical research, and the repositories, standards, and services
          that describe them.
      - domain_id: musicology
        label: Musicology
        description: >
          Musical sources, works, people, performances, collections, and
          musicological research data, including catalogues, repositories,
          standards, and related cultural heritage services.
      - domain_id: performing-arts
        label: Performing arts
        description: >
          Theatre, dance, performance, productions, participants, venues,
          archives, collections, and the research infrastructures and standards
          used to document performing arts.
    familiarity_scopes:
      - scope_id: nfdi4culture-ckg
        label: NFDI4Culture Culture Knowledge Graph
        kind: knowledge_graph

  - kg_id: europeana
    seed_version: "2026-08-23.3"
    name: Europeana Knowledge Graph
    project: Europeana
    description_hint: >
      Cross-domain cultural heritage knowledge graph aggregating metadata about
      digitised objects from European museums, libraries, archives, and
      audiovisual collections, represented using the Europeana Data Model and
      linked to contextual resources for people, places, concepts, and periods.
    sparql:
      endpoint: https://api.europeana.eu/sparql
      auth: none
      expected_namespaces:
        - http://www.europeana.eu/schemas/edm/
        - http://www.openarchives.org/ore/terms/
        - http://purl.org/dc/elements/1.1/
        - http://purl.org/dc/terms/
        - http://www.w3.org/2004/02/skos/core#
    source_ids:
      - europeana-sparql-api-documentation
      - europeana-sparql-console-examples
      - europeana-sparql-api-examples
      - europeana-sparql-console-select-examples
    priority: medium
    notes: >
      Retain the eight labelled examples from the official SPARQL API
      documentation and all 52 titled examples from the console's official JSON
      source, then deduplicate their overlap during extraction. The JSON includes
      46 SELECT and six DESCRIBE examples; the DESCRIBE examples are preserved as
      evidence but excluded from the SELECT-only corpus. Generic graph probes and
      a small number of queries require syntax, currency, or semantic review. The historical
      https://sparql.europeana.eu/ URL redirects to the console; use the current
      backend configured here for programmatic execution.
    review_domains:
      - domain_id: european-cross-domain-cultural-heritage
        label: European cross-domain cultural heritage
        description: >
          Digitised cultural heritage objects and their metadata across European
          museums, libraries, archives, and audiovisual collections, including
          creators, contributors, places, concepts, periods, media resources,
          rights, providers, aggregators, datasets, and external authority links.
    familiarity_scopes:
      - scope_id: europeana
        label: Europeana Knowledge Graph and Europeana Data Model
        kind: knowledge_graph
