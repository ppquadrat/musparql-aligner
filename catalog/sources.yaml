sources:
  - source_id: organs-knowledge-graph-repository
    type: repository
    title: Polifonia Organs Knowledge Graph repository
    url: https://github.com/polifonia-project/organs-knowledge-graph

  - source_id: organs-ontology-readme
    type: web_document
    title: Polifonia Organs Ontology documentation
    url: https://github.com/polifonia-project/organs-ontology/blob/main/README.md

  - source_id: organs-ontology-curated-extract
    type: derivative
    title: Curated extract of the Organs Ontology documentation
    local_path: catalog/curated/organs__02__raw-githubusercontent-com_curated.txt
    derived_from: [organs-ontology-readme]
    description: Locally curated extraction retained to make the evidence-selection step reproducible.

  - source_id: meetups-knowledge-graph-repository
    type: repository
    title: Polifonia MEETUPS Knowledge Graph repository
    url: https://github.com/polifonia-project/meetups-knowledge-graph

  - source_id: meetups-query-examples
    type: web_document
    title: Polifonia MEETUPS example queries
    url: https://polifonia.kmi.open.ac.uk/meetups/queries.php

  - source_id: meetups-semmes-2023-paper
    type: local_document
    title: "Musical Meetups: a Knowledge Graph approach for Historical Social Network Analysis"
    url: https://ceur-ws.org/Vol-3443/ESWC_2023_SEMMES_Meetups-CR.pdf
    local_path: catalog/pdfs/2023_SEMMES_Meetups-CR.pdf
    description: Downloaded SEMMES 2023 paper retained as a source of competency questions and domain context.

  - source_id: meetups-eswc-2024-paper
    type: publication
    title: "Musical Meetups Knowledge Graph (MMKG): a collection of evidence for historical social network analysis"
    url: https://doi.org/10.1007/978-3-031-60635-9_7
    local_path: catalog/pdfs/Meetups_ESWC.pdf

  - source_id: musow-registry-data-repository
    type: repository
    title: Polifonia registry-data repository
    url: https://github.com/polifonia-project/registry-data

  - source_id: musow-licence-experiments-repository
    type: repository
    title: MusOW licence experiments repository
    url: https://github.com/polifonia-project/musow-licences-experiments-llm

  - source_id: musow-project-page
    type: web_document
    title: MusOW project page
    url: https://polifonia-project.eu/musow

  - source_id: musicbo-knowledge-graph-repository
    type: repository
    title: Polifonia MusicBO Knowledge Graph repository
    url: https://github.com/polifonia-project/musicbo-knowledge-graph

  - source_id: jazz-ontology-repository
    type: repository
    title: Dig That Lick and Jazz Ontology repository
    url: https://github.com/ppquadrat/DigThatLick

  - source_id: jazz-ontology-2022-paper
    type: publication
    title: "The Jazz Ontology: A semantic model and large-scale RDF repositories for jazz"
    url: https://doi.org/10.1016/j.websem.2022.100735

  - source_id: jazz-ontology-supplement
    type: local_document
    title: Supplement to The Jazz Ontology
    url: https://ars.els-cdn.com/content/image/1-s2.0-S1570826822000245-mmc1.pdf
    local_path: catalog/pdfs/Jazz Ontology supplement.pdf
    derived_from: [jazz-ontology-2022-paper]
    description: Open supplementary material containing competency questions and example SPARQL queries; the local copy is retained for reproducible extraction.

  - source_id: polifonia-d2-1-deliverable
    type: publication
    title: "Polifonia D2.1: Ontology-based knowledge graphs for music objects"
    url: https://cordis.europa.eu/project/id/101004746/results
    local_path: catalog/pdfs/Polifonia_D2.1_V1.0.pdf

  - source_id: polifonia-ontology-network-2023-paper
    type: publication
    title: "The Polifonia Ontology Network: Building a Semantic Backbone for Musical Heritage"
    url: https://doi.org/10.1007/978-3-031-47243-5_17
    local_path: catalog/pdfs/Polifonia_ISWC.pdf

  - source_id: sesemmi-linkedmusic-2025-paper
    type: publication
    title: "SESEMMI for LinkedMusic: Democratizing Access to Musical Archives via Large Language Models"
    url: https://openreview.net/forum?id=hSDeNeUzcy

  - source_id: sesemmi-linkedmusic-2026-acm-paper
    type: publication
    title: "Facilitating Access to LinkedMusic with SESEMMI: Converting Natural Language Queries to SPARQL with Large Language Models"
    url: https://doi.org/10.1145/3815723.3815727
    query_role: none
    description: Open-access DLfM 2026 paper containing one complete authored cross-database NLQ-SPARQL example in Appendix A; retained as parent evidence for the curated derivative.

  - source_id: sesemmi-linkedmusic-2026-acm-paper-query
    type: derivative
    title: LinkedMusic query curated from the DLfM 2026 SESEMMI paper
    local_path: catalog/curated/linkedmusic-sesemmi-2026-acm-paper-query.jsonl
    derived_from: [sesemmi-linkedmusic-2026-acm-paper]
    query_role: canonical
    description: Source-faithful transcription of the Appendix A NLQ-SPARQL example over the LinkedMusic MusicBrainz and DIAMM named graphs; line numbers copied from the HTML rendering were removed, while the paper's absence of inline PREFIX declarations was preserved.

  - source_id: sesemmi-linkedmusic-repository
    type: repository
    title: SESEMMI LinkedMusic agent repository
    url: https://github.com/DDMAL/SESEMMI
    exclude_test_fixtures: true

  - source_id: linkedmusic-datalake-repository
    type: repository
    title: LinkedMusic Data Lake repository
    url: https://github.com/DDMAL/linkedmusic-datalake

  - source_id: linkedmusic-queries-repository
    type: repository
    title: LinkedMusic natural-language-to-SPARQL experiments repository
    url: https://github.com/DDMAL/linkedmusic-queries

  - source_id: linkedmusic-project-website
    type: web_document
    title: LinkedMusic project website
    url: https://linkedmusic.ca/

  - source_id: linkedmusic-sample-queries
    type: web_document
    title: Sample LinkedMusic Queries
    url: https://github.com/DDMAL/linkedmusic-datalake/wiki/Sample-LinkedMusic-Queries

  - source_id: linkedmusic-prefix-catalogue
    type: web_document
    title: LinkedMusic graph and entity prefix catalogue
    url: https://github.com/DDMAL/linkedmusic-datalake/wiki/List-of-Prefixes-for-SPARQL-Queries

  - source_id: linkedmusic-public-query-database
    type: web_document
    title: Public LinkedMusic Query Database
    url: https://docs.google.com/spreadsheets/d/1Bsb1fZXPUGgqAMfNQeCf4J5l0p5rLhTQMCwRc0ZVrFs/edit?gid=1479578801#gid=1479578801
    local_path: catalog/curated/LinkedMusic_Queries_Official.jsonl
    query_role: canonical

  - source_id: linkedmusic-public-query-database-capture-metadata
    type: derivative
    title: Capture metadata for the Public LinkedMusic Query Database export
    local_path: catalog/curated/LinkedMusic_Queries_Official.meta.json
    derived_from: [linkedmusic-public-query-database]
    query_role: none

  - source_id: linkedmusic-public-query-database-xlsx-snapshot
    type: derivative
    title: Captured XLSX export of the Public LinkedMusic Query Database
    local_path: catalog/curated/LinkedMusic_Public_Query_Database_2026-08-03.xlsx
    derived_from: [linkedmusic-public-query-database]
    query_role: none

  - source_id: linkedmusic-integrating-databases-2025-article
    type: publication
    title: "Integrating Online Music Databases: The LinkedMusic Project"
    url: https://brainfood.musicology.org/vol-9-no-1-2025/integrating-online-music-databases/

  - source_id: linkedmusic-sustainable-archiving-2025-paper
    type: publication
    title: Sustainable Archiving of Music Databases through RDF and NLQ2SPARQL
    url: https://doi.org/10.1145/3748336.3748353

  - source_id: linkedmusic-corrected-examples-working-copy
    type: derivative
    title: Musparql-corrected working copy of the LinkedMusic examples
    local_path: catalog/curated/LinkedMusic_Queries_Corrected.md
    derived_from: [linkedmusic-public-query-database, sesemmi-linkedmusic-2025-paper]
    query_role: edit_source
    description: Working copy retained as append-only SPARQL edits. Fifteen queries are principally self-contained normalizations and five contain substantive federated-query rewrites; live comparison found no improvement in coarse execution outcomes.

  - source_id: musparql-approved-sparql-edits
    type: derivative
    title: Public-safe archive of approved Musparql SPARQL versions
    local_path: catalog/curated/Approved_SPARQL_Edits.jsonl
    derived_from:
      - organs-ontology-curated-extract
      - jazz-ontology-repository
      - linkedmusic-public-query-database
      - linkedmusic-corrected-examples-working-copy
    query_role: edit_source
    description: Append-only approved SPARQL versions with immutable hashes and minimal non-private provenance, used to restore version state after clean extraction.

  - source_id: alyra-talos-dataset-page
    type: web_document
    title: TALOS AI4SSH ALyrA dataset page
    url: https://talos-ai4ssh.uoc.gr/resources/open-datasets/open-dataset-2-ancient-lyric-poetry-alyra-ontology/
    query_role: none
    description: Official project documentation for ALyrA v1.0, including creators, scope, metrics, license, and links to the Zenodo deposit.

  - source_id: alyra-zenodo-v1
    type: web_document
    title: Archaic Lyric Agora (ALyrA) ontoterminology version 1.0
    url: https://zenodo.org/records/13371967
    query_role: canonical
    description: Official versioned dataset record containing five human-authored natural-language question and SPARQL pairs.

  - source_id: alyra-v1-rdf-export
    type: local_document
    title: ALyrA v1.0 RDF/XML export
    url: https://zenodo.org/records/13371967/files/ALyrA_v.1.0.rdf.rdf?download=1
    local_path: var/cache/dumps/alyra-v1.0.rdf
    query_role: none
    description: Complete official v1.0 ontology-plus-instance export; the local cache is used to execute ALyrA queries without a live endpoint.

  - source_id: alyra-mdtt-2025-paper
    type: publication
    title: "Creating ontoterminologies for antiquity: workflow, challenges and solutions"
    url: https://ceur-ws.org/Vol-3990/paper4.pdf
    local_path: catalog/pdfs/2025-mdtt-creating-ontoterminologies-for-antiquity.pdf
    query_role: none
    description: The complete paper contains one ALyrA query and two queries for other ontoterminologies; bulk query extraction is disabled to prevent cross-KG attribution.

  - source_id: alyra-mdtt-2025-paper-query
    type: derivative
    title: ALyrA query curated from the MDTT 2025 ontoterminology paper
    local_path: catalog/curated/alyra-mdtt-2025-paper-query.jsonl
    derived_from: [alyra-mdtt-2025-paper]
    query_role: canonical
    description: Source-faithful extraction of only the ALyrA SELECT query from section 4, pages 6-7 and Figure 5; excludes the paper's Ancient Greek Oratory and Göbekli Tepe queries.

  - source_id: camera-dei-deputati-ocd-documentation
    type: web_document
    title: OCD semantic representation and documentation
    url: https://dati.camera.it/ocd-rappresentazione-semantica-e-documentazione
    query_role: canonical
    description: Official Italian documentation containing natural-language formulations and 21 displayed SPARQL examples; one bibliography intent is duplicated and the examples largely use older legislature versions.

  - source_id: camera-dei-deputati-endpoint-examples
    type: web_document
    title: Camera dei Deputati SPARQL endpoint examples
    url: https://dati.camera.it/ocd/dump/custom_endpoint/sparql.xml
    query_role: none
    description: Official machine-readable XML loaded by the endpoint interface, currently containing 22 Italian natural-language formulations paired with SPARQL, including newer legislature variants and an additional debate query; retained as the parent evidence for the curated derivative.

  - source_id: camera-dei-deputati-endpoint-examples-curated
    type: derivative
    title: Curated Camera dei Deputati endpoint examples
    local_path: catalog/curated/camera-dei-deputati-endpoint-examples.jsonl
    derived_from: [camera-dei-deputati-endpoint-examples]
    query_role: canonical
    description: Mechanical source-faithful extraction of all 22 Italian natural-language/SPARQL pairs from the official endpoint examples XML.

  - source_id: camera-dei-deputati-sparna-article
    type: web_document
    title: "dati.camera.it's Sparnatural instance: a query builder for the Italian Chamber of Deputies"
    url: https://www.sparna.fr/en/posts/dati-camera-it-s-sparnatural-instance-a-query-builder-for-the-italian-chamber-of-deputies/
    query_role: none
    description: Third-party authored article containing three English-described Camera dei Deputati SPARQL examples displayed in screenshots; retained as the parent evidence for the curated transcription.

  - source_id: camera-dei-deputati-sparna-examples-curated
    type: derivative
    title: Curated Camera dei Deputati examples from the Sparna article
    local_path: catalog/curated/camera-dei-deputati-sparna-examples.jsonl
    derived_from: [camera-dei-deputati-sparna-article]
    query_role: canonical
    description: Source-faithful manual transcription of the three clear query screenshots, paired with their authored English formulations; deduplicate against the official examples during extraction.

  - source_id: cdec-official-sparql-examples
    type: web_document
    title: CDEC SPARQL query examples
    url: https://dati.cdec.it/esempi.html
    query_role: canonical
    description: Official page containing nine Italian natural-language formulations paired with complete SELECT queries over the historical CDEC Shoah named graph.

  - source_id: nfdi4culture-ckg-query-page
    type: web_document
    title: NFDI4Culture public Culture Knowledge Graph query page
    url: https://nfdi4culture.de/resources/knowledge-graph.html
    query_role: none
    description: Official public query interface linking three domain-specific authored examples and four generic graph-inspection queries; only the three domain examples are retained in the curated derivative.

  - source_id: nfdi4culture-ckg-deep-dive
    type: publication
    title: Culture Knowledge Graph deep dive
    url: https://zenodo.org/records/18292744
    query_role: none
    description: Official NFDI4Culture presentation whose pages 22, 26, and 39 link three complete authored CKG queries covering RISM and Gregorovius letters, Epidat with Wikidata, and community standards in data portals.

  - source_id: nfdi4culture-ckg-approved-examples
    type: derivative
    title: Curated NFDI4Culture Culture Knowledge Graph examples
    local_path: catalog/curated/nfdi4culture-ckg-approved-examples.jsonl
    derived_from: [nfdi4culture-ckg-query-page, nfdi4culture-ckg-deep-dive]
    query_role: canonical
    description: Source-faithful capture of the six approved authored NL-SPARQL pairs; excludes the four generic inspection/count queries and repository maintenance or ontology-quality-control SPARQL.

  - source_id: europeana-sparql-api-documentation
    type: web_document
    title: Europeana SPARQL API documentation
    url: https://europeana.atlassian.net/wiki/spaces/EF/pages/2385870903/SPARQL+API+Documentation
    query_role: none
    description: Official authored documentation containing eight labelled SPARQL examples in its More examples section; the rendered Confluence HTML mangles examples 6 and 8, so query extraction uses the source-faithful curated derivative.

  - source_id: europeana-sparql-api-examples
    type: derivative
    title: Curated Europeana SPARQL API documentation examples
    local_path: catalog/curated/europeana-sparql-api-examples.jsonl
    derived_from: [europeana-sparql-api-documentation]
    query_role: canonical
    description: Source-faithful capture of all eight labelled examples from the More examples section; the two federated queries were recovered from the percent-encoded query-service links in the official Confluence storage representation rather than its mangled rendered code blocks.

  - source_id: europeana-sparql-console-examples
    type: web_document
    title: Europeana SPARQL console query samples
    url: https://raw.githubusercontent.com/europeana/sparql-ui/master/europeana/query-samples.json
    query_role: none
    description: Official machine-readable source used by the Europeana SPARQL console, containing 52 titled authored examples across general, media, contextual-resource, and provenance categories; all 52 remain preserved in the source snapshot, including six DESCRIBE examples outside the SELECT-only corpus policy.

  - source_id: europeana-sparql-console-select-examples
    type: derivative
    title: Curated SELECT examples from the Europeana SPARQL console
    local_path: catalog/curated/europeana-sparql-console-select-examples.jsonl
    derived_from: [europeana-sparql-console-examples]
    query_role: canonical
    description: Mechanical source-faithful conversion of the console JSON's 46 SELECT examples to curated NL-SPARQL records; the six DESCRIBE examples remain in the parent snapshot but are intentionally excluded from the SELECT-only query corpus.
